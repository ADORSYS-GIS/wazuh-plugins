pipeline:
  name: wazuh-agent
  description: Repackage upstream Wazuh agent binaries for Linux and macOS targets.
  version_file: version.txt
  release_file: release.txt
  builder: native
  native_build_script: build/main.py
  artifacts:
    dest: dist
build:
  syft_version: v1.5.0
dependencies:
  apt:
    - sudo
    - git
    - python3
    - python3-venv
    - python3-pip
    - ca-certificates
    - curl
    - dpkg-dev
    - rpm
    - gnupg2
  brew:
    - curl
ci:
  lint:
    - find . -name "*.py" -type f -exec python3 -m py_compile {} \;
    - find . -name "*.sh" -type f -exec bash -n {} \;
  tests:
    - name: version-file-present
      command: test -s version.txt
