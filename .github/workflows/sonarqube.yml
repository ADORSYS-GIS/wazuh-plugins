name: SonarQube

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=builders --cov=.github/scripts --cov-report=xml:coverage.xml --cov-report=term tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml

  scan:
    name: SonarQube Scan
    needs: test
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sonarqube.yml@7ff1bbd8ae9b1ee58cd195ff80b95c03b7787205 # main
    with:
      project-key: wazuh-plugins
      coverage-artifact-name: coverage-report
      coverage-report-paths: coverage.xml
      exclusions: "**/coverage/**,**/__pycache__/**,**/venv/**,**/.venv/**,tests/**"
      extra-sonar-args: -Dsonar.coverage.exclusions=**/*.sh,scripts/**
    secrets:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
