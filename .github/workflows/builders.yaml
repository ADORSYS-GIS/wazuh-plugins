name: Builder pipelines

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main
    paths:
      - 'builders/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'builders/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_builders: ${{ steps.set-matrix.outputs.has_builders }}
      builder_names: ${{ steps.set-matrix.outputs.builder_names }}
      repo_lc: ${{ steps.set-matrix.outputs.repo_lc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: set-matrix
        name: Set matrix
        run: python .github/scripts/discover_matrix.py

  build-linux:
    needs: discover
    if: needs.discover.outputs.has_builders == 'true'
    name: "Linux x ${{ matrix.builder }} x ${{ matrix.triplet }}"
    permissions:
      contents: write
      # Only pulls the cache-builders image; publishing happens in
      # cache-builders.yaml, so write access to packages is not needed here.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        builder: ${{ fromJson(needs.discover.outputs.builder_names) }}
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - os: ubuntu-24.04
            arch: amd64
            triplet: linux-amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            triplet: linux-arm64
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/${{ needs.discover.outputs.repo_lc }}/cache-builders:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0:0
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up pkg-config paths
        run: |
          set -euo pipefail
          multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "PKG_CONFIG_PATH=/usr/lib/${multiarch}/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
      - name: Set up Python environment
        shell: bash
        run: |
          if [[ ! -d .venv ]]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --only-binary :all: --require-hashes \
            -r .github/workflows/venv-requirements.txt
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.triplet }} artifact
        env:
          PIPELINE_COMMIT: ${{ github.sha }}
          PIPELINE_REF: ${{ github.ref }}
          PIPELINE_REPO: ${{ github.repository }}
        run: |
          .github/scripts/run_builder.py \
            --artifact-triplet ${{ matrix.triplet }} \
            builders/${{ matrix.builder }}/config.yaml
      - id: package
        shell: bash
        name: Package artifacts
        run: |
          python .github/scripts/package_artifacts.py \
            "${{ matrix.builder }}" \
            "${{ matrix.triplet }}"
      - name: Upload ${{ matrix.builder }} ${{ matrix.triplet }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.builder }}-${{ steps.package.outputs.version }}-${{ matrix.triplet }}
          path: ${{ steps.package.outputs.artifact_path }}
      - name: Publish ${{ matrix.builder }} release
        if: |
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')) &&
          matrix.triplet == 'linux-amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ matrix.builder }}-v${{ steps.package.outputs.version }}"
          title="${{ matrix.builder }} ${{ steps.package.outputs.version }}"
          # Idempotent on purpose: this used to be softprops/action-gh-release,
          # which PATCHes tag_name when the release already exists and fails
          # with `already_exists` if another release claims that tag (that is
          # what broke the wazuh-agent 0.5.2 build).
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; updating metadata."
          else
            gh release create "$tag" --title "$title" --latest --repo "$repo"
          fi
          gh release edit "$tag" --title "$title" --latest --repo "$repo"
      - name: Upload ${{ matrix.builder }} release assets
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ matrix.builder }}-v${{ steps.package.outputs.version }}"
          files="${{ steps.package.outputs.files }}"
          if [[ -z "${files// }" ]]; then
            echo "No release files to upload."
            exit 0
          fi
          asset_paths=()
          while IFS= read -r path; do
            if [[ -n "${path// }" ]]; then
              asset_paths+=("$path")
            fi
          done <<< "${files}"
          if [[ ${#asset_paths[@]} -eq 0 ]]; then
            echo "No release files to upload."
            exit 0
          fi
          for i in {1..12}; do
            if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            echo "Release ${tag} not ready yet, waiting... ($i)"
            sleep 10
          done
          gh release upload "${tag}" "${asset_paths[@]}" --clobber --repo "${{ github.repository }}"


  build-macos:
    needs: discover
    if: needs.discover.outputs.has_builders == 'true'
    name: "MacOS x ${{ matrix.builder }} x ${{ matrix.triplet }}"
    permissions:
      contents: write
      # Only pulls the cache-builders image; publishing happens in
      # cache-builders.yaml, so write access to packages is not needed here.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        builder: ${{ fromJson(needs.discover.outputs.builder_names) }}
        include:
          - arch: amd64
            triplet: macos-amd64
            runner: [self-hosted, wazuh-runner, X64]
          - arch: arm64
            triplet: macos-arm64
            runner: [self-hosted, wazuh-runner, ARM64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python environment
        shell: bash
        env:
          # A tagged uv release is immutable, so this digest stays valid.
          UV_VERSION: "0.13.9"
          UV_INSTALLER_SHA256: "ccc888115ac831bd9c30855c1d4abeae32fce679701d2aac8e72eb0beffb41c2"
        run: |
          set -euo pipefail
          # The runner's RUNNER_TOOL_CACHE points at /Users/runner, which the
          # runner user cannot create, so actions/setup-python fails with
          # "mkdir: /Users/runner: Permission denied". Provision a pinned
          # standalone CPython under $HOME with uv instead.
          #
          # Pinning matters: the runner's `python3` tracks Homebrew (now
          # CPython 3.15) and `--only-binary :all:` cannot resolve PyYAML on a
          # CPython with no published wheels. 3.12 has wheels for it and
          # matches the Python used by the other workflows.
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            uv_installer="${tmp}/uv-installer.sh"
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
              "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-installer.sh" \
              -o "${uv_installer}"
            # Verify before executing, and refuse anything but HTTPS.
            echo "${UV_INSTALLER_SHA256}  ${uv_installer}" | shasum -a 256 -c -
            sh "${uv_installer}"
            rm -rf "${tmp}"
          fi
          rm -rf .venv
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install --only-binary :all: --require-hashes \
            -r .github/workflows/venv-requirements.txt
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.triplet }} artifact
        env:
          PIPELINE_COMMIT: ${{ github.sha }}
          PIPELINE_REF: ${{ github.ref }}
          PIPELINE_REPO: ${{ github.repository }}
        run: |
          .github/scripts/run_builder.py \
            --artifact-triplet ${{ matrix.triplet }} \
            builders/${{ matrix.builder }}/config.yaml
      - id: package
        shell: bash
        run: |
          python .github/scripts/package_artifacts.py \
            "${{ matrix.builder }}" \
            "${{ matrix.triplet }}"
      - name: Upload ${{ matrix.builder }} ${{ matrix.triplet }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.builder }}-${{ steps.package.outputs.version }}-${{ matrix.triplet }}
          path: ${{ steps.package.outputs.artifact_path }}
      - name: Publish ${{ matrix.builder }} release
        if: |
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')) &&
          matrix.triplet == 'linux-amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          tag="${{ matrix.builder }}-v${{ steps.package.outputs.version }}"
          title="${{ matrix.builder }} ${{ steps.package.outputs.version }}"
          # Idempotent on purpose: this used to be softprops/action-gh-release,
          # which PATCHes tag_name when the release already exists and fails
          # with `already_exists` if another release claims that tag (that is
          # what broke the wazuh-agent 0.5.2 build).
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; updating metadata."
          else
            gh release create "$tag" --title "$title" --latest --repo "$repo"
          fi
          gh release edit "$tag" --title "$title" --latest --repo "$repo"
      - name: Upload ${{ matrix.builder }} release assets
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ matrix.builder }}-v${{ steps.package.outputs.version }}"
          files="${{ steps.package.outputs.files }}"
          if [[ -z "${files// }" ]]; then
            echo "No release files to upload."
            exit 0
          fi
          asset_paths=()
          while IFS= read -r path; do
            if [[ -n "${path// }" ]]; then
              asset_paths+=("$path")
            fi
          done <<< "${files}"
          if [[ ${#asset_paths[@]} -eq 0 ]]; then
            echo "No release files to upload."
            exit 0
          fi
          for i in {1..12}; do
            if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            echo "Release ${tag} not ready yet, waiting... ($i)"
            sleep 10
          done
          gh release upload "${tag}" "${asset_paths[@]}" --clobber --repo "${{ github.repository }}"
          
