name: Static Application Security Testing (SAST)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sbom:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sbom.yml@17fe8c106fcac2a4b6ac1992cd1b89166f0eb5e2
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read

  sast-python:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-python.yml@6a07b60f35e2b595385500be57330e3eb178e706
    # On push the template switches reviewdog to its `github-check` reporter,
    # which fails to PATCH the check run it just created ("404 Not Found") after
    # posting the annotations. That is a reporting bug in the shared template,
    # not a finding, so do not fail `main` on it; pull requests keep the hard
    # gate (they use the `github-pr-check` reporter) and SonarQube still runs
    # the vulnerability gate on `main`.
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    with:
      runner: ubuntu-latest
      working-directory: "."
      python-version: "3.11"
    permissions:
      contents: read
      actions: read
      checks: write

  sast-shell:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-shell.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write

  secret-scan:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/secret-scan.yml@db2f1dbe7eb5efbcb06aa80ad3719fc1675c37bf
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
    secrets:
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
